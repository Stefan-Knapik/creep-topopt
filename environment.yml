name: creep-topopt
channels:
  - conda-forge
dependencies:
  - python==3.14
  - numpy
  - scipy
  - matplotlib
  - meshio
  - petsc4py
  - fenics-dolfinx
  - fenics-libdolfinx
  - pip
  - gmsh
  - python-gmsh
  - pyfiglet
  - pandas
  - openpyxl
  - xlsxwriter
  - ipykernel
  - pytest
  - ruff
  - absl-py
  - pyyaml
  - plotly
  - nbformat
  - nbconvert
  - pypdf
  - python-kaleido
  - cython
  - pypardiso
  - cupy
  - nvitop
  - scikit-learn
  - paraview
  - pip:
    - "jax[cuda13]"
    - flax
    - optax
    - optimistix
    - lineax
    - nlopt
    - spineax

# results/ and figures/ were produced with: python 3.14, jax 0.12.0.1 (cuda13), optimistix 0.1.0, equinox 0.13.8, lineax 0.1.1, numpy 2.5.4, scipy 1.17.1, basix 0.11.0, pypardiso 0.4.7, matplotlib 3.11.2, pandas 3.1.0.
